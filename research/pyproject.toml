[project]
name = "keel-research"
version = "0.1.0"
description = "Research, simulator, model fitting and evaluation for Keel"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pytest>=8",
  "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
